name: Portfolio CI/CD Build & Deploy

on:
  push:
    branches:
      - main # Startet automatisch, sobald du Code in den main-Branch pushst

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Quellcode aus deinem GitHub-Repo auschecken
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Node.js Umgebung einrichten
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. NPM-Pakete sauber installieren
      - name: Install Dependencies
        run:
          npm install

          # 4. Das Angular-Projekt für die Produktion kompilieren
      - name: Build Angular App
        run: npm run build

      # 5. Die gebauten Dateien per echtem SFTP auf deinen Linux-Server schieben
      - name: Deploy to Server via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: 'dist/portfolio/browser/*'
          target: '/var/www/jermaine-jerome-baerwolf.de/'
          strip_components: 3

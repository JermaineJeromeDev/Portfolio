name: Portfolio CI/CD Build & Deploy

on:
  push:
    branches:
      - main # Startet automatisch, sobald du Code in den main-Branch pushst

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Quellcode aus deinem GitHub-Repo auschecken
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Node.js Umgebung einrichten
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. NPM-Pakete sauber installieren
      - name: Install Dependencies
        run: npm install

      # 4. Das Angular-Projekt für die Produktion kompilieren
      - name: Build Angular App
        run: npm run build

      # 5. Den Inhalt des browser-Ordners automatisch per SFTP auf den Linux-Server laden
      - name: Deploy to Server via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          protocol: sftp
          port: 22
          local-dir: dist/portfolio/browser/
          server-dir: /var/www/jermaine-jerome-baerwolf.de/

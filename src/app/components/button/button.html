<button [type]="type" [disabled]="disabled" class="btn-base" [ngClass]="{
            'btn-primary': variant === 'primary',
            'btn-secondary': variant === 'secondary',
            'btn-language': variant === 'language',
            'btn-green': color === 'green',
            'btn-cyan': color === 'cyan',
            'is-active': isActive
        }">
    <ng-content></ng-content>
</button>

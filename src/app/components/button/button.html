<button [type]="type" [disabled]="disabled" class="btn" [ngClass]="{
        'btn--primary': variant === 'primary',
        'btn--secondary': variant === 'secondary',
        'btn--language': variant === 'language',
        'btn--green': color === 'green',
        'btn--cyan': color === 'cyan',
        'btn--active': isActive
    }">
    <ng-content></ng-content>
</button>

<div class="menu" [class.menu--open]="isOpen">
    <div class="menu__header">
        <app-logo class="menu__logo-wrapper"></app-logo>

        <button class="menu__close" type="button" aria-label="Menü schließen" (click)="closeMenu()">
            <span class="menu__close-line menu__close-line--top"></span>
            <span class="menu__close-line menu__close-line--bottom"></span>
        </button>
    </div>

    <nav class="menu__nav">
        <ul class="menu__list">
            <li class="menu__item"><a [routerLink]="['/']" [fragment]="'about'" routerLinkActive="menu__link--active"
                    [routerLinkActiveOptions]="{ matrixParams: 'ignored', queryParams: 'ignored', paths: 'exact', fragment: 'exact' }"
                    class="menu__link" (click)="closeMenu()">{{ 'NAV.ABOUT' | translate }}</a></li>
            <li class="menu__item"><a [routerLink]="['/']" [fragment]="'skills'" routerLinkActive="menu__link--active"
                    [routerLinkActiveOptions]="{ matrixParams: 'ignored', queryParams: 'ignored', paths: 'exact', fragment: 'exact' }"
                    class="menu__link" (click)="closeMenu()">{{ 'NAV.SKILLS' | translate }}</a></li>
            <li class="menu__item"><a [routerLink]="['/']" [fragment]="'portfolio'"
                    routerLinkActive="menu__link--active"
                    [routerLinkActiveOptions]="{ matrixParams: 'ignored', queryParams: 'ignored', paths: 'exact', fragment: 'exact' }"
                    class="menu__link" (click)="closeMenu()">{{ 'NAV.PORTFOLIO' | translate }}</a></li>
            <li class="menu__item"><a [routerLink]="['/']" [fragment]="'contact'" routerLinkActive="menu__link--active"
                    [routerLinkActiveOptions]="{ matrixParams: 'ignored', queryParams: 'ignored', paths: 'exact', fragment: 'exact' }"
                    class="menu__link" (click)="closeMenu()">{{ 'NAV.CONTACT' | translate }}</a></li>

            <li class="menu__item menu__item--languages">
                <span class="menu__lang" [class.menu__lang--active]="currentLang === 'EN'"
                    (click)="selectLanguage('EN')">EN</span>
                <span class="menu__divider">/</span>
                <span class="menu__lang" [class.menu__lang--active]="currentLang === 'DE'"
                    (click)="selectLanguage('DE')">DE</span>
            </li>
        </ul>
    </nav>
</div>
